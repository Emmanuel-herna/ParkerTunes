name: Android build
# Rebuild after stable Android signing secrets were configured.

on:
  push:
    branches: [main]
    paths-ignore:
      - ".appetize-key"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".appetize-key"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js for the lyrics component
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the exact AM Lyrics 1.9.1 component
        run: |
          npm install --prefix lyrics-web --no-audit --no-fund
          npm run build --prefix lyrics-web
          test -s app/src/main/assets/lyrics/am-lyrics.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare stable debug signing key
        id: debug-signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::warning::Stable Android signing secrets are not configured yet; this run will use a temporary debug key."
            echo "Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets to make the OAuth signing fingerprint stable."
            exit 0
          fi
          keystore="$RUNNER_TEMP/parkertunes-ci.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          if [[ ! -s "$keystore" ]]; then
            echo "Decoded Android signing keystore is empty." >&2
            exit 1
          fi
          echo "PARKERTUNES_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "PARKERTUNES_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build debug APK
        id: build-apk
        run: gradle --no-daemon :app:assembleDebug

      - name: Print APK signing SHA-1
        id: signing-sha1
        if: ${{ steps.build-apk.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "Android SDK apksigner was not found." >&2
            exit 1
          fi
          echo "Signing certificate for $apk:"
          cert_output="$("$apksigner" verify --print-certs "$apk")"
          printf '%s\n' "$cert_output"
          sha1="$(printf '%s\n' "$cert_output" | sed -nE 's/.*certificate SHA-1 digest: ([[:xdigit:]]+).*/\1/p' | head -n 1)"
          if [[ -z "$sha1" ]]; then
            echo "Could not extract the APK signing SHA-1 fingerprint." >&2
            exit 1
          fi
          echo "APK signing SHA-1: $sha1"
          echo "### Android debug APK signing SHA-1" >> "$GITHUB_STEP_SUMMARY"
          printf '`%s`\n' "$sha1" >> "$GITHUB_STEP_SUMMARY"

      - name: Run Roborazzi screenshot tests
        id: roborazzi
        if: ${{ always() && steps.build-apk.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Roborazzi attempt $attempt/3"
            if gradle --no-daemon :app:recordRoborazziDebug; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              delay=$((attempt * 20))
              echo "Gradle task failed; retrying in ${delay}s (this can happen when Maven Central rate-limits downloads)." >&2
              sleep "$delay"
            fi
          done
          echo "Roborazzi screenshot tests failed after 3 attempts." >&2
          exit 1

      - name: Upload Roborazzi screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Plyra-roborazzi-screenshots
          path: app/build/outputs/roborazzi
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare Firebase service account credentials
        id: firebase-credentials
        if: ${{ always() && steps.build-apk.outcome == 'success' }}
        shell: bash
        run: |
          if [[ -z "$GOOGLE_APPLICATION_CREDENTIALS" ]]; then
            echo "GOOGLE_APPLICATION_CREDENTIALS secret is missing." >&2
            exit 1
          fi
          if [[ "$GOOGLE_APPLICATION_CREDENTIALS" == \{* ]]; then
            credential_file="$RUNNER_TEMP/firebase-service-account.json"
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS" > "$credential_file"
          elif [[ -f "$GOOGLE_APPLICATION_CREDENTIALS" ]]; then
            credential_file="$GOOGLE_APPLICATION_CREDENTIALS"
          else
            echo "GOOGLE_APPLICATION_CREDENTIALS must contain service-account JSON or a valid file path." >&2
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credential_file" >> "$GITHUB_ENV"

      - name: Upload APK to Firebase App Distribution
        id: firebase-upload
        if: ${{ always() && steps.build-apk.outcome == 'success' && steps.firebase-credentials.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon appDistributionUploadDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/firebase-distribution.log"

      - name: Publish Firebase distribution links
        if: ${{ always() && steps.firebase-upload.outcome == 'success' }}
        shell: bash
        run: |
          echo "### Firebase App Distribution — testers" >> "$GITHUB_STEP_SUMMARY"
          sed -E 's/\x1B\[[0-9;]*[mK]//g' "$RUNNER_TEMP/firebase-distribution.log" |
            grep -Eo 'https?://[^[:space:]]+' | sort -u |
            while IFS= read -r link; do echo "- $link" >> "$GITHUB_STEP_SUMMARY"; done
          echo "Group: testers" >> "$GITHUB_STEP_SUMMARY"

      # The public key is an identifier, not a credential. It is committed so
      # every future workflow run updates the same Appetize app in place.
      - name: Read Appetize app key
        id: appetize-key
        shell: bash
        run: |
          if [[ -s .appetize-key ]]; then
            echo "public_key=$(tr -d '\r\n' < .appetize-key)" >> "$GITHUB_OUTPUT"
          else
            echo "public_key=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Appetize
        id: appetize
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.APPETIZE_TOKEN != '' }}
        uses: appetizeio/github-action-appetize@v1.1.0
        continue-on-error: true
        with:
          apiToken: ${{ secrets.APPETIZE_TOKEN }}
          publicKey: ${{ steps.appetize-key.outputs.public_key }}
          appFile: app/build/outputs/apk/debug/app-debug.apk
          platform: android
          note: Plyra GitHub Actions build ${{ github.run_number }}

      - name: Save Appetize key for future builds
        if: ${{ steps.appetize.outputs.publicKey != '' && github.ref == 'refs/heads/main' }}
        env:
          PUBLIC_KEY: ${{ steps.appetize.outputs.publicKey }}
        run: |
          current_key="$(tr -d '\r\n' < .appetize-key 2>/dev/null || true)"
          if [[ "$current_key" != "$PUBLIC_KEY" ]]; then
            printf '%s' "$PUBLIC_KEY" > .appetize-key
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .appetize-key
            git commit -m "ci: save Appetize preview key [skip ci]"
            git push
          fi

      - name: Publish Appetize preview URL
        if: ${{ steps.appetize.outputs.publicKey != '' }}
        env:
          PUBLIC_KEY: ${{ steps.appetize.outputs.publicKey }}
        run: |
          echo "### Plyra live preview" >> "$GITHUB_STEP_SUMMARY"
          echo "https://appetize.io/app/$PUBLIC_KEY" >> "$GITHUB_STEP_SUMMARY"

      - name: Note skipped Appetize upload
        if: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || env.APPETIZE_TOKEN == '' }}
        run: |
          echo "### Appetize preview" >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$APPETIZE_TOKEN" ]]; then
            echo "Skipped: add the APPETIZE_TOKEN repository secret to enable the live preview upload." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped: Appetize uploads run only for pushes and manual runs on main." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload debug APK
        if: ${{ always() && steps.build-apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Plyra-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
