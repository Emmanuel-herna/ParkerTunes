name: Android build

on:
  push:
    branches: [main]
    paths-ignore:
      - ".appetize-key"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".appetize-key"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      APPETIZE_TOKEN: ${{ secrets.APPETIZE_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compile and package debug APK
        run: gradle --no-daemon :app:assembleDebug

      # The public key is an identifier, not a credential. It is committed so
      # every future workflow run updates the same Appetize app in place.
      - name: Read Appetize app key
        id: appetize-key
        shell: bash
        run: |
          if [[ -s .appetize-key ]]; then
            echo "public_key=$(tr -d '\r\n' < .appetize-key)" >> "$GITHUB_OUTPUT"
          else
            echo "public_key=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Appetize
        id: appetize
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.APPETIZE_TOKEN != '' }}
        uses: appetizeio/github-action-appetize@v1.1.0
        continue-on-error: true
        with:
          apiToken: ${{ secrets.APPETIZE_TOKEN }}
          publicKey: ${{ steps.appetize-key.outputs.public_key }}
          appFile: app/build/outputs/apk/debug/app-debug.apk
          platform: android
          note: ParkerTunes GitHub Actions build ${{ github.run_number }}

      - name: Save Appetize key for future builds
        if: ${{ steps.appetize.outputs.publicKey != '' && github.ref == 'refs/heads/main' }}
        env:
          PUBLIC_KEY: ${{ steps.appetize.outputs.publicKey }}
        run: |
          current_key="$(tr -d '\r\n' < .appetize-key 2>/dev/null || true)"
          if [[ "$current_key" != "$PUBLIC_KEY" ]]; then
            printf '%s' "$PUBLIC_KEY" > .appetize-key
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .appetize-key
            git commit -m "ci: save Appetize preview key [skip ci]"
            git push
          fi

      - name: Publish Appetize preview URL
        if: ${{ steps.appetize.outputs.publicKey != '' }}
        env:
          PUBLIC_KEY: ${{ steps.appetize.outputs.publicKey }}
        run: |
          echo "### ParkerTunes live preview" >> "$GITHUB_STEP_SUMMARY"
          echo "https://appetize.io/app/$PUBLIC_KEY" >> "$GITHUB_STEP_SUMMARY"

      - name: Note skipped Appetize upload
        if: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || env.APPETIZE_TOKEN == '' }}
        run: |
          echo "### Appetize preview" >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "$APPETIZE_TOKEN" ]]; then
            echo "Skipped: add the APPETIZE_TOKEN repository secret to enable the live preview upload." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped: Appetize uploads run only for pushes and manual runs on main." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ParkerTunes-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
