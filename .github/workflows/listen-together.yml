name: Listen Together backend
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/listen-together.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/listen-together.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go test ./...
      - run: go build ./...
