<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      color: #fff;
    }

    body {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }

    #lyrics-status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
      color: #E9E2FF;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(182, 156, 255, 0.16), transparent 66%),
        linear-gradient(180deg, #17131F 0%, #100F15 100%);
      font: 500 14px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: 0.01em;
      text-align: center;
      text-wrap: balance;
      z-index: 2;
    }

    #lyrics-status[hidden] { display: none; }

    am-lyrics {
      display: block;
      position: relative;
      inset: auto;
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      min-height: 0;
      box-sizing: border-box;
      color: #fff;
      --am-lyrics-highlight-color: #C7B2FF;
      --highlight-color: #C7B2FF;
      --lyplus-font-size-base: clamp(24px, 5.8vw, 32px);
      --am-lyrics-line-height: 1.32;
      --am-lyrics-line-spacing: 23px;
      --am-lyrics-inline-padding: 20px;
      --am-lyrics-inactive-scale: 0.97;
      --am-lyrics-highlight-radius: 18px;
      --am-lyrics-highlight-surface: rgba(182, 156, 255, 0.09);
      --am-lyrics-progression-feather: 34px;
      --lyplus-blur-amount: 0.045em;
      --lyplus-blur-amount-near: 0.02em;
      --lyrics-scroll-padding-top: 34%;
    }
  </style>
</head>
<body>
  <div id="lyrics-status" role="status">Waiting for track information…</div>

  <script>
    (() => {
      const status = document.getElementById('lyrics-status');
      let lyrics = null;
      let activeTrackKey = null;
      let pendingTrack = null;
      let componentReady = false;
      let diagnosticsTimer = null;

      const showStatus = message => {
        if (!status) return;
        status.textContent = message;
        status.hidden = false;
      };

      function createLyrics(track, key) {
        console.info('ParkerTunes lyrics: creating am-lyrics', {
          title: track.title || '', artist: track.artist || '',
          query: track.query || ''
        });
        const element = document.createElement('am-lyrics');

        // Set all search metadata before connecting the element. Its
        // connectedCallback starts the provider lookup immediately.
        element.songTitle = track.title || '';
        element.songArtist = track.artist || '';
        element.songAlbum = track.album || '';
        element.query = track.query ||
          [track.title, track.artist].filter(Boolean).join(' ');
        element.songDurationMs = track.durationMs > 0
          ? track.durationMs
          : undefined;
        element.paused = !track.playing;
        element.currentTime = Math.max(0, Number(track.positionMs) || 0);
        // The player card follows playback; expanded lyrics become a readable,
        // manually scrollable song sheet instead of pinning one line on screen.
        element.noBlur = true;
        if (track.readerMode) {
          element.autoScroll = false;
          element.setAttribute('reader-mode', '');
        }

        element.addEventListener('line-click', event => {
          const timestamp = Number(event.detail && event.detail.timestamp);
          if (
            Number.isFinite(timestamp) &&
            timestamp >= 0 &&
            window.ParkerLyricsBridge
          ) {
            window.ParkerLyricsBridge.seekTo(timestamp);
          }
        });

        lyrics = element;
        activeTrackKey = key;
        // Give the custom element a real layout height. Android WebView can
        // report 100vh/absolute hosts as zero-height; a normal-flow host with
        // a pixel minimum lets its shadow-DOM lyrics container measure itself.
        element.style.setProperty('position', 'relative', 'important');
        element.style.setProperty('inset', 'auto', 'important');
        element.style.setProperty('display', 'block', 'important');
        element.style.setProperty('width', '100%', 'important');
        element.style.setProperty('height', '100%', 'important');
        element.style.setProperty('min-height', '0', 'important');
        element.style.setProperty('box-sizing', 'border-box', 'important');
        document.body.appendChild(element);

        // Do not hide the fallback message merely because the custom element
        // was appended. Lit renders asynchronously; a failed/empty shadow DOM
        // must never leave the native lyrics panel looking like a black void.
        const verifyRender = async () => {
          try {
            if (element.updateComplete) await element.updateComplete;
          } catch (error) {
            console.error('ParkerTunes lyrics: component render failed', error);
          }
          requestAnimationFrame(() => {
            const root = element.shadowRoot;
            // A wrapper alone is not proof that anything is visible.
            // The previous check matched .lyrics-container even when it was
            // empty, which hid the fallback status and left a black panel.
            const rendered = root && (
              root.querySelector('.skeleton-line') ||
              root.querySelector('.no-lyrics') ||
              root.querySelector('.lyrics-line')
            );
            if (rendered) {
              if (status) status.hidden = true;
              console.info('ParkerTunes lyrics: component rendered', {
                shadowChildren: root.children.length,
                loading: element.isLoading
              });
            } else {
              showStatus('Lyrics view could not render. The component started, but its content is missing.');
              console.error('ParkerTunes lyrics: no rendered content in component shadow root', {
                hasShadowRoot: !!root,
                shadowHtml: root ? root.innerHTML.slice(0, 500) : null,
                width: element.getBoundingClientRect().width,
                height: element.getBoundingClientRect().height
              });
            }
          });
        };
        verifyRender();

        // Keep the lyrics area useful if a provider lookup stalls or returns
        // no result. This is deliberately inside the lyrics panel only.
        clearTimeout(diagnosticsTimer);
        diagnosticsTimer = setTimeout(() => {
          if (lyrics !== element || (Array.isArray(element.lyrics) && element.lyrics.length > 0)) return;
          const title = track.title || 'this track';
          const loading = element.isLoading === true;
          showStatus(loading
            ? 'Still searching for lyrics for "' + title + '". Check your internet connection and wait a little longer.'
            : 'The lyrics component loaded, but no lyrics were returned for "' + title + '".');
          console.warn('ParkerTunes lyrics diagnostic:', {
            title,
            artist: track.artist || '',
            isLoading: element.isLoading,
            lyricsPresent: Array.isArray(element.lyrics) && element.lyrics.length > 0,
            source: element.lyricsSource || null,
            availableSources: element.availableSources
              ? element.availableSources.map(source => source.source)
              : []
          });
        }, 20000);
      }

      function applyTrack(track) {
        console.info('ParkerTunes lyrics: setParkerTrack received', {
          id: track.id || '', title: track.title || '', artist: track.artist || '',
          durationMs: track.durationMs || 0
        });
        if (!componentReady) {
          pendingTrack = track;
          return;
        }

        const title = String(track.title || '').trim();
        const artist = String(track.artist || '').trim();
        if (!title && !artist) {
          showStatus('Play a track to see its lyrics.');
          return;
        }

        const key = [track.id, title, artist].join('\u0000');
        if (!lyrics || key !== activeTrackKey) {
          if (lyrics) lyrics.remove();
          lyrics = null;
          activeTrackKey = null;
          createLyrics(track, key);
          return;
        }

        lyrics.paused = !track.playing;
        lyrics.currentTime = Math.max(0, Number(track.positionMs) || 0);
      }

      window.setParkerTrack = applyTrack;

      window.addEventListener('error', event => {
        const detail = event.message ? String(event.message).slice(0, 140) : 'Unknown JavaScript error';
        showStatus('Lyrics error: ' + detail);
        console.error('ParkerTunes lyrics error:', event.message || event);
      });
      window.addEventListener('unhandledrejection', event => {
        const detail = event.reason && event.reason.message
          ? String(event.reason.message).slice(0, 140)
          : 'A lyrics request failed.';
        showStatus('Lyrics request error: ' + detail);
        console.error('ParkerTunes lyrics rejected:', event.reason);
      });

      customElements.whenDefined('am-lyrics').then(() => {
        console.info('ParkerTunes lyrics: custom element am-lyrics is defined');
        componentReady = true;
        if (pendingTrack) {
          const track = pendingTrack;
          pendingTrack = null;
          applyTrack(track);
        } else {
          showStatus('Play a track to see its lyrics.');
        }
      });
    })();
  </script>

  <script type="module" src="./am-lyrics.js"
    onerror="console.error('ParkerTunes lyrics: failed to load am-lyrics.js'); document.getElementById('lyrics-status').textContent='Lyrics component failed to load. Please check your connection and reopen the player.'"></script>
  <script>
    setTimeout(() => {
      if (!customElements.get('am-lyrics')) {
        console.error('ParkerTunes lyrics: am-lyrics was not registered within 8 seconds');
        const status = document.getElementById('lyrics-status');
        if (status) {
          status.textContent = 'Lyrics component did not load. Please reopen the player.';
          status.hidden = false;
        }
      }
    }, 8000);
  </script>
</body>
</html>
