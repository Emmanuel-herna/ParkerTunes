<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      color: #fff;
    }

    #lyrics-status {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
      color: #B69CFF;
      background: #111015;
      font: 13px Arial, sans-serif;
      text-align: center;
      z-index: 2;
    }

    #lyrics-status[hidden] { display: none; }

    body { position: relative; }

    am-lyrics {
      display: block;
      width: 100%;
      height: 100%;
      color: #fff;
      --am-lyrics-highlight-color: #B69CFF;
      --highlight-color: #B69CFF;
      --lyplus-font-size-base: 23px;
      --am-lyrics-line-height: 1.25;
      --am-lyrics-line-spacing: 16px;
      --am-lyrics-inline-padding: 14px;
      --lyrics-scroll-padding-top: 25%;
    }
  </style>
</head>
<body>
  <div id="lyrics-status" role="status">Loading lyrics…</div>
  <am-lyrics
    id="parker-am-lyrics"
    auto-scroll
    interpolate
    highlight-color="#B69CFF"
    font-family="Arial, sans-serif"
  ></am-lyrics>

  <script>
    (() => {
      const lyrics = document.getElementById('parker-am-lyrics');
      let activeTrackKey = null;
      let pendingTrack = null;

      function applyTrack(track) {
        if (!lyrics || !customElements.get('am-lyrics')) {
          pendingTrack = track;
          return;
        }

        const key = [track.id, track.title, track.artist].join('\u0000');
        if (key !== activeTrackKey) {
          activeTrackKey = key;
          lyrics.songTitle = track.title || '';
          lyrics.songArtist = track.artist || '';
          lyrics.songAlbum = track.album || '';
          lyrics.query = track.query || [track.title, track.artist].filter(Boolean).join(' ');
          lyrics.songDurationMs = track.durationMs > 0 ? track.durationMs : undefined;
          lyrics.currentTime = 0;
        }

        lyrics.paused = !track.playing;
        lyrics.currentTime = Math.max(0, Number(track.positionMs) || 0);
      }

      window.setParkerTrack = applyTrack;

      const status = document.getElementById('lyrics-status');
      let ready = false;
      const showFailure = message => {
        if (status && !ready) status.textContent = message;
      };

      window.addEventListener('error', event => {
        showFailure('Lyrics could not start. Please try reopening the player.');
        console.error('ParkerTunes lyrics error:', event.message || event);
      });
      window.addEventListener('unhandledrejection', event => {
        console.error('ParkerTunes lyrics rejected:', event.reason);
      });

      customElements.whenDefined('am-lyrics').then(() => {
        ready = true;
        if (status) status.hidden = true;
        lyrics.addEventListener('line-click', event => {
          const timestamp = Number(event.detail && event.detail.timestamp);
          if (
            Number.isFinite(timestamp) &&
            timestamp >= 0 &&
            window.ParkerLyricsBridge
          ) {
            window.ParkerLyricsBridge.seekTo(timestamp);
          }
        });

        if (pendingTrack) {
          const track = pendingTrack;
          pendingTrack = null;
          applyTrack(track);
        }
      });
    })();
  </script>

  <script type="module" src="./am-lyrics.js"
    onerror="document.getElementById('lyrics-status').textContent='Lyrics component failed to load. Please check your connection and reopen the player.'"></script>
  <script>
    setTimeout(() => {
      if (!customElements.get('am-lyrics')) {
        const status = document.getElementById('lyrics-status');
        if (status) status.textContent = 'Lyrics component did not load. Please reopen the player.';
      }
    }, 8000);
  </script>
</body>
</html>
