services:
  - type: web
    name: parkertunes-listen-together
    runtime: go
    rootDir: backend
    buildCommand: go mod tidy && go build -o server .
    startCommand: ./server
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: JAM_MAX_MEMBERS
        value: "5"
      - key: JAM_STATE_HEARTBEAT_MS
        value: "5000"
      - key: JAM_PLAY_LEAD_MS
        value: "350"
