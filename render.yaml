services:
  - type: web
    name: parkertunes-listen-together
    runtime: go
    rootDir: backend
    buildCommand: go mod tidy && go build -o server .
    startCommand: ./server
    healthCheckPath: /healthz
    plan: free
    envVars:
      - key: GOOGLE_WEB_CLIENT_ID
        value: 512448803456-q5l3pr6h6uovcrhkea9u2qlv86t7hkc1.apps.googleusercontent.com
